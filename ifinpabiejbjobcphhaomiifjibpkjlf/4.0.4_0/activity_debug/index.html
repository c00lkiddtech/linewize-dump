<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Activity Events</title><style>body {
                font-family: monospace;
                padding: 0.75rem;
            }

            button.active {
                font-weight: bold;
            }

            #controls {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                margin-bottom: 1rem;
            }
            .control-row {
                display: flex;
                align-items: center;
                gap: 1rem;
                flex-wrap: wrap;
            }
            .control-row label {
                display: flex;
                align-items: center;
                gap: 0.25rem;
                cursor: pointer;
            }
            button {
                padding: 0.4rem 0.8rem;
                cursor: pointer;
            }

            table {
                border-collapse: collapse;
                width: 100%;
                font-size: 0.85rem;
                table-layout: fixed;
            }

            tr:nth-child(even) {
                background: #fafafa;
            }

            th,
            td {
                border: 1px solid #ccc;
                padding: 4px 6px;
                text-align: left;
                vertical-align: top;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            th {
                background: #f0f0f0;
                white-space: nowrap;
            }

            #raw-table th:nth-child(1) {
                width: 10ch;
            } /* Time */
            #raw-table th:nth-child(2) {
                width: 10ch;
            } /* ID */
            #raw-table th:nth-child(3) {
                width: 10ch;
            } /* Type */
            #raw-table th:nth-child(4) {
                width: 30ch;
            } /* title */
            #raw-table th:nth-child(5),
            #raw-table th:nth-child(6),
            #raw-table th:nth-child(7),
            #raw-table th:nth-child(8),
            #raw-table th:nth-child(9),
            #raw-table th:nth-child(10) {
                width: 7ch;
            } /* bool props + idleState */
            /* Raw data gets the remaining space */

            #summary-table th:nth-child(2) {
                width: 30ch;
            } /* title */
            #summary-table th:nth-child(3) {
                width: 30ch;
            } /* URL */

            .prop {
                display: block;
                text-align: center;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .prop-true {
                background: #d4edda;
                color: #155724;
            }
            .prop-false {
                background: #f8d7da;
                color: #721c24;
            }
            .prop-active {
                background: #cce5ff;
                color: #004085;
            }
            .prop-idle {
                background: #fff3cd;
                color: #856404;
            }
            .prop-locked {
                background: #e2d9f3;
                color: #432874;
            }
            fieldset {
                border: 1px solid #ccc;
                padding: 0.5rem 1rem;
            }
            legend {
                font-weight: bold;
            }

            .faded {
                color: #aaa;
            }

            pre {
                margin: 0;
                padding: 0;
            }

            pre[data-collapsible] {
                white-space: pre-wrap;
                word-break: break-all;
                overflow: hidden;
                max-height: 200px;
                overflow-y: auto;
                cursor: pointer;
            }

            pre[data-collapsed] {
                white-space: collapse nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }</style><script defer="defer" src="main.bundle.js"></script></head><body><h1>Activity Events</h1><div id="controls"><div class="control-row"><button id="tab-events" class="active">Events</button> <button id="tab-pages">Pages</button> <label>From: <input type="date" id="date-from"/></label> <label>To: <input type="date" id="date-to"/></label><div style="flex: 1"></div><button id="refresh">↺ Refresh</button></div><fieldset><legend>Event types</legend><div class="control-row" id="type-filters"></div></fieldset><fieldset id="update-props-fieldset"><legend>Update properties (show updates where at least one is changed)</legend><div class="control-row" id="update-prop-filters"></div></fieldset><div id="doc-filter-row" style="display: none" class="control-row"><strong>Filtering by document:</strong> <span id="doc-filter-label"></span> <button id="doc-filter-clear">✕ Clear</button></div></div><p id="status"></p><table id="raw-table"><thead><tr><th>Time</th><th>ID</th><th>Type</th><th>Title</th><th>Active</th><th>Visible</th><th>Focused</th><th>Audible</th><th>Idle</th><th>Blocked</th><th>Raw data</th></tr></thead><tbody id="table-body"></tbody></table><table id="summary-table" style="display: none"><thead><tr><th>ID</th><th>Title</th><th>URL</th><th>Opened</th><th>Last update</th><th>Closed</th><th>Updates</th><th>Errors</th></tr></thead><tbody id="summary-body"></tbody></table></body></html>
